<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#012169"><title>Paz's Sale | Catálogo</title><link rel="icon" type="image/svg+xml" href="../qabum-logo.svg"><style>:root{--blue:#012169;--red:#C8102E;--white:#fff;--black:#000;--line:rgba(1,33,105,.16)}*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;background:#fff;color:#000}.head{border-bottom:4px solid var(--blue);padding:18px 18px 15px;display:flex;align-items:center;justify-content:space-between;gap:16px;position:sticky;top:0;background:rgba(255,255,255,.97);backdrop-filter:blur(12px);z-index:10}.head h1{margin:3px 0 0;color:var(--blue);font-size:clamp(28px,6vw,44px)}.eyebrow{font-size:12px;font-weight:800;color:var(--red);text-transform:uppercase;letter-spacing:.08em}.head img{width:145px;max-width:32vw;height:auto}.wrap{max-width:1180px;margin:auto;padding:20px 16px 80px}.intro{display:flex;justify-content:space-between;align-items:end;gap:18px;flex-wrap:wrap}.intro p{margin:4px 0;color:#000}.updated{font-size:12px}.filters{display:grid;grid-template-columns:1.4fr .8fr .8fr;gap:10px;margin:18px 0}.filters input,.filters select{width:100%;padding:12px 14px;border:1px solid var(--line);border-radius:999px;background:#fff;color:#000;font:inherit}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px}.card{border:1px solid var(--line);border-radius:20px;overflow:hidden;background:#fff;box-shadow:0 12px 32px rgba(1,33,105,.08)}.photo{height:230px;background:rgba(1,33,105,.04);position:relative;display:flex;align-items:center;justify-content:center;color:var(--blue);font-weight:800}.photo img{width:100%;height:100%;object-fit:cover}.status{position:absolute;top:12px;left:12px;border-radius:999px;padding:7px 10px;background:#fff;color:var(--blue);font-size:12px;font-weight:900;border:1px solid var(--line)}.status.vendido{background:var(--black);color:#fff;border-color:#000}.status.reservado{background:var(--red);color:#fff;border-color:var(--red)}.body{padding:15px}.body h2{font-size:19px;margin:0 0 7px}.meta{font-size:12px;font-weight:800;color:var(--blue);text-transform:uppercase;letter-spacing:.04em}.desc{font-size:14px;line-height:1.45;min-height:42px;margin:8px 0 14px}.price{font-size:30px;font-weight:900;color:var(--blue)}.sold .photo img{filter:grayscale(.7);opacity:.75}.empty,.loading{padding:30px;border:2px dashed var(--line);border-radius:20px;text-align:center}.contact{margin-top:24px;padding:16px;border-radius:18px;background:var(--blue);color:#fff;display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap}.contact a{color:#fff;font-weight:800}footer{padding:20px;text-align:center;border-top:1px solid var(--line);font-size:13px}footer a{color:var(--blue);font-weight:900;text-decoration:none}@media(max-width:700px){.filters{grid-template-columns:1fr}.head img{width:115px}.photo{height:210px}}</style></head><body><header class="head"><div><div class="eyebrow">Catálogo en vivo</div><h1>Paz's Sale</h1></div><a href="https://qabum.com" target="_blank" rel="noopener"><img src="../qabum-logo.svg" alt="Qabum™"></a></header><main class="wrap"><section class="intro"><div><h2 id="catalogTitle">Objetos disponibles</h2><p id="location"></p></div><div class="updated" id="updated">Cargando…</div></section><div class="filters"><input id="q" type="search" placeholder="Buscar"><select id="category"><option value="">Todas las categorías</option></select><select id="status"><option value="">Todos los estados</option><option value="DISPONIBLE">Disponible</option><option value="PUBLICADO">Publicado</option><option value="RESERVADO">Reservado</option><option value="VENDIDO">Vendido</option></select></div><div id="grid" class="grid"><div class="loading">Cargando inventario…</div></div><div id="contact" class="contact" hidden></div></main><footer>Powered by <a href="https://qabum.com" target="_blank" rel="noopener">Qabum™</a></footer><script type="module">const OWNER_ID='';const AUTH_URL='https://ep-silent-credit-awhuo8p7.neonauth.c-12.us-east-1.aws.neon.tech/neondb/auth';const DATA_URL='https://ep-silent-credit-awhuo8p7.apirest.c-12.us-east-1.aws.neon.tech/neondb/rest/v1';let all=[];const money=n=>new Intl.NumberFormat('en-US',{style:'currency',currency:'USD'}).format(Number(n||0));const esc=s=>String(s||'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));const labels={DISPONIBLE:'Disponible',PUBLICADO:'Publicado',RESERVADO:'Reservado',VENDIDO:'Vendido'};function render(){const q=document.getElementById('q').value.trim().toLowerCase(),cat=document.getElementById('category').value,st=document.getElementById('status').value;const rows=all.filter(i=>(!q||`${i.title} ${i.description} ${i.category}`.toLowerCase().includes(q))&&(!cat||i.category===cat)&&(!st||i.status===st));document.getElementById('grid').innerHTML=rows.length?rows.map(i=>`<article class="card ${i.status==='VENDIDO'?'sold':''}"><div class="photo">${i.photos?.[0]?`<img src="${i.photos[0]}" alt="${esc(i.title)}">`:'Sin foto'}<span class="status ${String(i.status).toLowerCase()}">${labels[i.status]||esc(i.status)}</span></div><div class="body"><div class="meta">${esc(i.category||'Sin categoría')}</div><h2>${esc(i.title)}</h2><div class="desc">${esc(i.description||'')}</div><div class="price">${money(i.asking_price)}</div></div></article>`).join(''):'<div class="empty">No hay artículos que coincidan con esos filtros.</div>'}async function init(){if(!OWNER_ID){document.getElementById('grid').innerHTML='<div class="empty">El catálogo todavía no está activado.</div>';document.getElementById('updated').textContent='';return}try{const mod=await import('https://esm.sh/@neondatabase/neon-js?bundle&target=es2022');const client=mod.createClient({auth:{adapter:mod.BetterAuthVanillaAdapter(),url:AUTH_URL,allowAnonymous:true},dataApi:{url:DATA_URL}});const {data:settings,error:se}=await client.from('paz_sale_public_settings').select('owner_user_id,catalog_title,contact_name,contact_phone,location_text,updated_at').eq('owner_user_id',OWNER_ID).limit(1);if(se)throw se;if(!settings?.length){document.getElementById('grid').innerHTML='<div class="empty">El catálogo todavía no está activado.</div>';document.getElementById('updated').textContent='';return}const s=settings[0];document.getElementById('catalogTitle').textContent=s.catalog_title||"Paz's Sale";document.getElementById('location').textContent=s.location_text||'';const {data,error}=await client.from('paz_sale_public_items').select('id,title,description,category,status,asking_price,photos,updated_at').eq('owner_user_id',OWNER_ID).order('updated_at',{ascending:false});if(error)throw error;all=data||[];const cats=[...new Set(all.map(i=>i.category).filter(Boolean))].sort();document.getElementById('category').innerHTML='<option value="">Todas las categorías</option>'+cats.map(c=>`<option>${esc(c)}</option>`).join('');const latest=all[0]?.updated_at||s.updated_at;document.getElementById('updated').textContent=latest?`Actualizado ${new Date(latest).toLocaleString('es-EC')}`:'';if(s.contact_name||s.contact_phone){const box=document.getElementById('contact');box.hidden=false;box.innerHTML=`<span><strong>${esc(s.contact_name||'Contacto')}</strong>${s.contact_phone?` · ${esc(s.contact_phone)}`:''}</span>${s.contact_phone?`<a href="https://wa.me/${String(s.contact_phone).replace(/\D/g,'')}" target="_blank" rel="noopener">WhatsApp</a>`:''}`}render()}catch(e){console.error(e);document.getElementById('grid').innerHTML='<div class="empty">No pude cargar el catálogo en este momento. Intenta nuevamente.</div>';document.getElementById('updated').textContent='';}}document.getElementById('q').addEventListener('input',render);document.getElementById('category').addEventListener('change',render);document.getElementById('status').addEventListener('change',render);init();</script></body></html>
