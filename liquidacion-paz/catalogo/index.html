<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#012169">
  <title>Paz's Sale | Catálogo</title>
  <link rel="icon" type="image/svg+xml" href="../qabum-logo.svg">
  <style>
    :root{--blue:#012169;--red:#C8102E;--white:#fff;--black:#000;--line:rgba(1,33,105,.16)}
    *{box-sizing:border-box}
    body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;background:#fff;color:#000}
    .head{border-bottom:4px solid var(--blue);padding:18px 18px 15px;display:flex;align-items:center;justify-content:space-between;gap:16px;position:sticky;top:0;background:rgba(255,255,255,.97);backdrop-filter:blur(12px);z-index:10}
    .head h1{margin:3px 0 0;color:var(--blue);font-size:clamp(28px,6vw,44px)}
    .eyebrow{font-size:12px;font-weight:800;color:var(--red);text-transform:uppercase;letter-spacing:.08em}
    .head img{width:145px;max-width:32vw;height:auto}
    .wrap{max-width:1180px;margin:auto;padding:20px 16px 80px}
    .intro{display:flex;justify-content:space-between;align-items:end;gap:18px;flex-wrap:wrap}.intro p{margin:4px 0;color:#000}.updated{font-size:12px}
    .filters{display:grid;grid-template-columns:1.4fr .8fr .8fr;gap:10px;margin:18px 0}
    .filters input,.filters select{width:100%;padding:12px 14px;border:1px solid var(--line);border-radius:999px;background:#fff;color:#000;font:inherit}
    .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px}
    .card{border:1px solid var(--line);border-radius:20px;overflow:hidden;background:#fff;box-shadow:0 12px 32px rgba(1,33,105,.08);scroll-margin-top:120px}
    .card.focused{outline:4px solid rgba(200,16,46,.25);outline-offset:3px}
    .photo{height:230px;background:rgba(1,33,105,.04);position:relative;display:flex;align-items:center;justify-content:center;color:var(--blue);font-weight:800;overflow:hidden}
    .slides{display:flex;width:100%;height:100%;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;-webkit-overflow-scrolling:touch}.slides::-webkit-scrollbar{display:none}
    .slide{flex:0 0 100%;width:100%;height:100%;scroll-snap-align:start}.slide img{width:100%;height:100%;object-fit:cover;display:block}
    .status{position:absolute;top:12px;left:12px;border-radius:999px;padding:7px 10px;background:#fff;color:var(--blue);font-size:12px;font-weight:900;border:1px solid var(--line);z-index:3}.status.vendido{background:var(--black);color:#fff;border-color:#000}.status.reservado{background:var(--red);color:#fff;border-color:var(--red)}
    .photo-count{position:absolute;right:12px;top:12px;background:rgba(0,0,0,.72);color:#fff;border-radius:999px;padding:6px 9px;font-size:12px;font-weight:800;z-index:3}
    .gallery-btn{position:absolute;top:50%;transform:translateY(-50%);z-index:3;width:38px;height:38px;border:0;border-radius:50%;background:rgba(255,255,255,.9);color:var(--blue);font-size:25px;font-weight:700;line-height:1;box-shadow:0 3px 12px rgba(0,0,0,.18);cursor:pointer}.gallery-btn.prev{left:10px}.gallery-btn.next{right:10px}
    .swipe-hint{position:absolute;bottom:8px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,.58);color:#fff;border-radius:999px;padding:4px 8px;font-size:10px;z-index:3;white-space:nowrap}
    .body{padding:15px}.body h2{font-size:19px;margin:0 0 7px}.meta{font-size:12px;font-weight:800;color:var(--blue);text-transform:uppercase;letter-spacing:.04em}.desc{font-size:14px;line-height:1.45;min-height:42px;margin:8px 0 14px}.price{font-size:30px;font-weight:900;color:var(--blue)}
    .item-actions{padding:0 15px 16px}.wa-item{display:flex;align-items:center;justify-content:center;width:100%;padding:12px 14px;border-radius:999px;background:var(--blue);color:#fff;text-decoration:none;font-weight:900;text-align:center}.wa-item:hover{filter:brightness(.94)}.sold .slides img{filter:grayscale(.7);opacity:.75}.sold .wa-item{display:none}
    .empty,.loading{padding:30px;border:2px dashed var(--line);border-radius:20px;text-align:center}.contact{margin-top:24px;padding:16px;border-radius:18px;background:var(--blue);color:#fff;display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap}.contact a{color:#fff;font-weight:800}
    footer{padding:20px;text-align:center;border-top:1px solid var(--line);font-size:13px}footer a{color:var(--blue);font-weight:900;text-decoration:none}
    @media(max-width:700px){.filters{grid-template-columns:1fr}.head img{width:115px}.photo{height:310px}.gallery-btn{width:36px;height:36px}.grid{grid-template-columns:1fr}}
  </style>
</head>
<body>
<header class="head"><div><div class="eyebrow">Catálogo en vivo</div><h1>Paz's Sale</h1></div><a href="https://qabum.com" target="_blank" rel="noopener"><img src="../qabum-logo.svg" alt="Qabum™"></a></header>
<main class="wrap">
  <section class="intro"><div><h2 id="catalogTitle">Objetos disponibles</h2><p id="location"></p></div><div class="updated" id="updated">Cargando…</div></section>
  <div class="filters"><input id="q" type="search" placeholder="Buscar"><select id="category"><option value="">Todas las categorías</option></select><select id="status"><option value="">Todos los estados</option><option value="DISPONIBLE">Disponible</option><option value="PUBLICADO">Publicado</option><option value="RESERVADO">Reservado</option><option value="VENDIDO">Vendido</option></select></div>
  <div id="grid" class="grid"><div class="loading">Cargando inventario…</div></div>
  <div id="contact" class="contact" hidden></div>
</main>
<footer>Powered by <a href="https://qabum.com" target="_blank" rel="noopener">Qabum™</a></footer>
<script type="module">
const OWNER_ID='75e74199-df4e-4905-b424-8871c8cc43bc';
const AUTH_URL='https://ep-silent-credit-awhuo8p7.neonauth.c-12.us-east-1.aws.neon.tech/neondb/auth';
const DATA_URL='https://ep-silent-credit-awhuo8p7.apirest.c-12.us-east-1.aws.neon.tech/neondb/rest/v1';
let all=[];let settings={};
const money=n=>new Intl.NumberFormat('en-US',{style:'currency',currency:'USD'}).format(Number(n||0));
const esc=s=>String(s||'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
const labels={DISPONIBLE:'Disponible',PUBLICADO:'Publicado',RESERVADO:'Reservado',VENDIDO:'Vendido'};
function waNumber(phone){let d=String(phone||'').replace(/\D/g,'');if(d.startsWith('5930'))d='593'+d.slice(4);else if(d.length===10&&d.startsWith('0'))d='593'+d.slice(1);else if(d.length===9&&d.startsWith('9'))d='593'+d;return d}
function itemUrl(id){const u=new URL('/',location.origin);u.searchParams.set('item',id);return u.toString()}
function waLink(i){const phone=waNumber(settings.contact_phone);if(!phone)return'';const text=`Hola Paz, me interesa “${i.title}” (${money(i.asking_price)}). ¿Sigue disponible?\n${itemUrl(i.id)}`;return `https://wa.me/${phone}?text=${encodeURIComponent(text)}`}
function gallery(i){const photos=(Array.isArray(i.photos)?i.photos:[]).filter(Boolean);if(!photos.length)return'<div>Sin foto</div>';const slides=photos.map((src,n)=>`<div class="slide"><img src="${esc(src)}" alt="${esc(i.title)} · foto ${n+1}" loading="lazy"></div>`).join('');const controls=photos.length>1?`<span class="photo-count" data-count="${esc(i.id)}">1/${photos.length}</span><button class="gallery-btn prev" type="button" data-prev="${esc(i.id)}" aria-label="Foto anterior">‹</button><button class="gallery-btn next" type="button" data-next="${esc(i.id)}" aria-label="Foto siguiente">›</button><span class="swipe-hint">Desliza para ver ${photos.length} fotos</span>`:'';return `<div class="slides" data-slides="${esc(i.id)}" data-total="${photos.length}">${slides}</div>${controls}`}
function attachGallery(){document.querySelectorAll('[data-prev]').forEach(b=>b.onclick=()=>move(b.dataset.prev,-1));document.querySelectorAll('[data-next]').forEach(b=>b.onclick=()=>move(b.dataset.next,1));document.querySelectorAll('[data-slides]').forEach(el=>{if(Number(el.dataset.total)>1)el.addEventListener('scroll',()=>updateCount(el),{passive:true})})}
function move(id,delta){const el=document.querySelector(`[data-slides="${id}"]`);if(!el)return;const total=Number(el.dataset.total||1),current=Math.round(el.scrollLeft/el.clientWidth),next=Math.max(0,Math.min(total-1,current+delta));el.scrollTo({left:next*el.clientWidth,behavior:'smooth'});setTimeout(()=>updateCount(el),320)}
function updateCount(el){const id=el.dataset.slides,total=Number(el.dataset.total||1),n=Math.min(total,Math.max(1,Math.round(el.scrollLeft/el.clientWidth)+1)),count=document.querySelector(`[data-count="${id}"]`);if(count)count.textContent=`${n}/${total}`}
function render(){const q=document.getElementById('q').value.trim().toLowerCase(),cat=document.getElementById('category').value,st=document.getElementById('status').value;const rows=all.filter(i=>(!q||`${i.title} ${i.description} ${i.category}`.toLowerCase().includes(q))&&(!cat||i.category===cat)&&(!st||i.status===st));document.getElementById('grid').innerHTML=rows.length?rows.map(i=>{const wa=waLink(i);return `<article id="item-${esc(i.id)}" class="card ${i.status==='VENDIDO'?'sold':''}"><div class="photo">${gallery(i)}<span class="status ${String(i.status).toLowerCase()}">${labels[i.status]||esc(i.status)}</span></div><div class="body"><div class="meta">${esc(i.category||'Sin categoría')}</div><h2>${esc(i.title)}</h2><div class="desc">${esc(i.description||'')}</div><div class="price">${money(i.asking_price)}</div></div>${wa&&i.status!=='VENDIDO'?`<div class="item-actions"><a class="wa-item" href="${wa}" target="_blank" rel="noopener">Consultar por WhatsApp</a></div>`:''}</article>`}).join(''):'<div class="empty">No hay artículos que coincidan con esos filtros.</div>';attachGallery();focusRequestedItem()}
function focusRequestedItem(){const id=new URL(location.href).searchParams.get('item');if(!id)return;const el=document.getElementById(`item-${id}`);if(!el)return;el.classList.add('focused');setTimeout(()=>el.scrollIntoView({behavior:'smooth',block:'center'}),80)}
async function init(){if(!OWNER_ID){document.getElementById('grid').innerHTML='<div class="empty">El catálogo todavía no está activado.</div>';document.getElementById('updated').textContent='';return}try{const mod=await import('https://esm.sh/@neondatabase/neon-js?bundle&target=es2022');const client=mod.createClient({auth:{adapter:mod.BetterAuthVanillaAdapter(),url:AUTH_URL,allowAnonymous:true},dataApi:{url:DATA_URL}});const {data:srows,error:se}=await client.from('paz_sale_public_settings').select('owner_user_id,catalog_title,contact_name,contact_phone,location_text,updated_at').eq('owner_user_id',OWNER_ID).limit(1);if(se)throw se;if(!srows?.length){document.getElementById('grid').innerHTML='<div class="empty">El catálogo todavía no está activado.</div>';document.getElementById('updated').textContent='';return}settings=srows[0];document.getElementById('catalogTitle').textContent=settings.catalog_title||"Paz's Sale";document.getElementById('location').textContent=settings.location_text||'';const {data,error}=await client.from('paz_sale_public_items').select('id,title,description,category,status,asking_price,photos,updated_at').eq('owner_user_id',OWNER_ID).order('updated_at',{ascending:false});if(error)throw error;all=data||[];const cats=[...new Set(all.map(i=>i.category).filter(Boolean))].sort();document.getElementById('category').innerHTML='<option value="">Todas las categorías</option>'+cats.map(c=>`<option>${esc(c)}</option>`).join('');const latest=all[0]?.updated_at||settings.updated_at;document.getElementById('updated').textContent=latest?`Actualizado ${new Date(latest).toLocaleString('es-EC')}`:'';if(settings.contact_name||settings.contact_phone){const box=document.getElementById('contact');box.hidden=false;const phone=waNumber(settings.contact_phone);box.innerHTML=`<span><strong>${esc(settings.contact_name||'Contacto')}</strong>${settings.contact_phone?` · ${esc(settings.contact_phone)}`:''}</span>${phone?`<a href="https://wa.me/${phone}?text=${encodeURIComponent("Hola Paz, vi tu catálogo y quisiera consultar por un artículo.")}" target="_blank" rel="noopener">WhatsApp</a>`:''}`}render()}catch(e){console.error(e);document.getElementById('grid').innerHTML='<div class="empty">No pude cargar el catálogo en este momento. Intenta nuevamente.</div>';document.getElementById('updated').textContent=''}}
document.getElementById('q').addEventListener('input',render);document.getElementById('category').addEventListener('change',render);document.getElementById('status').addEventListener('change',render);init();
</script>
</body>
</html>
