<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#012169"><title>Paz's Sale | Artículo</title><link rel="icon" type="image/svg+xml" href="../qabum-logo.svg"><style>:root{--blue:#012169;--red:#C8102E;--line:rgba(1,33,105,.16)}*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;color:#000;background:#fff}.head{border-bottom:4px solid var(--blue);padding:16px 18px;display:flex;align-items:center;justify-content:space-between;gap:16px}.head img{width:135px;max-width:34vw}.eyebrow{font-size:12px;font-weight:900;color:var(--red);text-transform:uppercase;letter-spacing:.08em}.wrap{max-width:900px;margin:auto;padding:22px 16px 70px}.back{display:inline-block;margin-bottom:16px;color:var(--blue);font-weight:800;text-decoration:none}.card{border:1px solid var(--line);border-radius:24px;overflow:hidden;box-shadow:0 14px 38px rgba(1,33,105,.09)}.photo{min-height:290px;background:rgba(1,33,105,.04);display:flex;align-items:center;justify-content:center;color:var(--blue);font-weight:800}.photo img{display:block;width:100%;max-height:560px;object-fit:cover}.body{padding:20px}.meta{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.pill{border:1px solid var(--line);border-radius:999px;padding:6px 9px;font-size:12px;font-weight:900;color:var(--blue)}.pill.reservado{background:var(--red);border-color:var(--red);color:#fff}.pill.vendido{background:#000;border-color:#000;color:#fff}h1{margin:12px 0 8px;color:var(--blue);font-size:clamp(28px,7vw,44px)}.desc{line-height:1.55;font-size:16px;white-space:pre-wrap}.price{font-size:38px;font-weight:950;color:var(--blue);margin:18px 0}.location{font-size:14px;margin:8px 0 18px}.actions{display:flex;gap:10px;flex-wrap:wrap}.btn{appearance:none;border:0;border-radius:999px;padding:12px 16px;font:inherit;font-weight:900;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;justify-content:center}.dark{background:var(--blue);color:#fff}.ghost{background:#fff;color:var(--blue);border:1px solid var(--line)}.empty{padding:34px;border:2px dashed var(--line);border-radius:22px;text-align:center}footer{padding:20px;text-align:center;border-top:1px solid var(--line);font-size:13px}footer a{color:var(--blue);font-weight:900;text-decoration:none}@media(max-width:600px){.actions .btn{flex:1}.photo{min-height:230px}}</style></head><body><header class="head"><div><div class="eyebrow">Paz's Sale</div><strong>Artículo disponible</strong></div><a href="https://qabum.com" target="_blank" rel="noopener"><img src="../qabum-logo.svg" alt="Qabum™"></a></header><main class="wrap"><a class="back" href="../../catalogo/">← Ver catálogo completo</a><div id="host"><div class="empty">Cargando artículo…</div></div></main><footer>Powered by <a href="https://qabum.com" target="_blank" rel="noopener">Qabum™</a></footer><script type="module">const OWNER_ID='75e74199-df4e-4905-b424-8871c8cc43bc';const AUTH_URL='https://ep-silent-credit-awhuo8p7.neonauth.c-12.us-east-1.aws.neon.tech/neondb/auth';const DATA_URL='https://ep-silent-credit-awhuo8p7.apirest.c-12.us-east-1.aws.neon.tech/neondb/rest/v1';const id=new URL(location.href).searchParams.get('id')||'';const money=n=>new Intl.NumberFormat('en-US',{style:'currency',currency:'USD'}).format(Number(n||0));const esc=s=>String(s||'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));const labels={DISPONIBLE:'Disponible',PUBLICADO:'Publicado',RESERVADO:'Reservado',VENDIDO:'Vendido'};let current=null,settings=null;function shareText(){return current?`${current.title} — ${money(current.asking_price)}\n${current.description||''}\n${settings?.location_text||''}\n${location.href}`.trim():location.href}async function nativeShare(){if(navigator.share){try{await navigator.share({title:current?.title||"Paz's Sale",text:`${current?.title||'Artículo'} — ${money(current?.asking_price)}`,url:location.href});return}catch(e){if(e?.name==='AbortError')return}}try{await navigator.clipboard.writeText(shareText());alert('Texto y enlace copiados')}catch{}}function wa(){location.href=`https://wa.me/?text=${encodeURIComponent(shareText())}`}async function init(){if(!id){document.getElementById('host').innerHTML='<div class="empty">No se indicó un artículo.</div>';return}try{const mod=await import('https://esm.sh/@neondatabase/neon-js?bundle&target=es2022');const client=mod.createClient({auth:{adapter:mod.BetterAuthVanillaAdapter(),url:AUTH_URL,allowAnonymous:true},dataApi:{url:DATA_URL}});const [{data:rows,error},{data:ss,error:se}]=await Promise.all([client.from('paz_sale_public_items').select('id,title,description,category,status,asking_price,photos,updated_at').eq('owner_user_id',OWNER_ID).eq('id',id).limit(1),client.from('paz_sale_public_settings').select('catalog_title,contact_name,contact_phone,location_text').eq('owner_user_id',OWNER_ID).limit(1)]);if(error)throw error;if(se)throw se;if(!rows?.length){document.getElementById('host').innerHTML='<div class="empty">Este artículo ya no está disponible en el catálogo.</div>';return}current=rows[0];settings=ss?.[0]||{};document.title=`${current.title} | Paz's Sale`;const phone=String(settings.contact_phone||'').replace(/\D/g,'');document.getElementById('host').innerHTML=`<article class="card"><div class="photo">${current.photos?.[0]?`<img src="${current.photos[0]}" alt="${esc(current.title)}">`:'Sin foto'}</div><div class="body"><div class="meta"><span class="pill ${String(current.status||'').toLowerCase()}">${labels[current.status]||esc(current.status)}</span>${current.category?`<span class="pill">${esc(current.category)}</span>`:''}</div><h1>${esc(current.title)}</h1><div class="desc">${esc(current.description||'')}</div><div class="price">${money(current.asking_price)}</div>${settings.location_text?`<div class="location">${esc(settings.location_text)}</div>`:''}<div class="actions">${phone?`<a class="btn dark" href="https://wa.me/${phone}?text=${encodeURIComponent(`Hola, me interesa ${current.title} de Paz's Sale: ${location.href}`)}" target="_blank" rel="noopener">Consultar por WhatsApp</a>`:''}<button class="btn ghost" id="share">Compartir</button><button class="btn ghost" id="wa">Enviar por WhatsApp</button></div></div></article>`;document.getElementById('share').addEventListener('click',nativeShare);document.getElementById('wa').addEventListener('click',wa)}catch(e){console.error(e);document.getElementById('host').innerHTML='<div class="empty">No pude cargar este artículo en este momento. Intenta nuevamente.</div>'}}init();</script></body></html>
