name: Localize SoA catalog images

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/sync-soa-assets.yml'

permissions:
  contents: write

jobs:
  download:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download catalog images into repository
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p seeds-of-anarchy/assets/genetics
          get() { curl -L --fail --retry 3 --retry-delay 2 --connect-timeout 20 --max-time 120 "$2" -o "seeds-of-anarchy/assets/genetics/$1"; }

          get bullshit-01.jpg 'https://cdn.shopify.com/s/files/1/0913/8841/2281/files/1.jpg?v=1766057486'
