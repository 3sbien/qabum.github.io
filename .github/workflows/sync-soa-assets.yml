          get spritzade-05.jpg 'https://cdn.shopify.com/s/files/1/0913/8841/2281/files/4_7c1bd9dc-ec23-4e52-921f-463c5b320554.jpg?v=1766058211'

          file seeds-of-anarchy/assets/genetics/*
          test -s seeds-of-anarchy/assets/genetics/bullshit-01.jpg
          test -s seeds-of-anarchy/assets/genetics/spritzade-01.jpg

      - name: Commit localized images
        shell: bash
        run: |
          set -euo pipefail
          git config user.name '3sbien'
          git config user.email '3sbien@gmail.com'
          git add seeds-of-anarchy/assets/genetics
          if git diff --cached --quiet; then
            echo 'No image changes to commit.'
          else
            git commit -m 'Localize Seeds of Anarchy catalog images'
            git push
          fi
